<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>PPP Loan Map (NC 150k+)</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .map-overlay {
            position: absolute; top: 10px; left: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px; font-family: sans-serif;
            border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div id="map"></div>
<div class="map-overlay">
    <h2>NC PPP Loans (≥$150k)</h2>
    <p>Phase 0 Prototype</p>
    <div id="status">Loading data...</div>
</div>

<script>
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
        center: [-79.0, 35.5],
        zoom: 6
    });

    map.on('load', async () => {
        const statusEl = document.getElementById('status');
        try {
            const res = await fetch('nc_150k_plus.json');
            const data = await res.json();
            statusEl.innerText = `Loaded ${data.length} loans.`;

            const features = data.map(loan => ({
                type: 'Feature',
                properties: {
                    id: loan.id,
                    name: loan.name,
                    amount: loan.amount
                },
                geometry: {
                    type: 'Point',
                    coordinates: [loan.lng, loan.lat]
                }
            }));

            map.addSource('loans', {
                type: 'geojson',
                data: {
                    type: 'FeatureCollection',
                    features: features
                },
                cluster: true,
                clusterMaxZoom: 14,
                clusterRadius: 50
            });

            map.addLayer({
                id: 'clusters',
                type: 'circle',
                source: 'loans',
                filter: ['has', 'point_count'],
                paint: {
                    'circle-color': [
                        'step',
                        ['get', 'point_count'],
                        '#51bbd6',
                        100,
                        '#f1f075',
                        750,
                        '#f28cb1'
                    ],
                    'circle-radius': [
                        'step',
                        ['get', 'point_count'],
                        20,
                        100,
                        30,
                        750,
                        40
                    ]
                }
            });

            map.addLayer({
                id: 'cluster-count',
                type: 'symbol',
                source: 'loans',
                filter: ['has', 'point_count'],
                layout: {
                    'text-field': '{point_count_abbreviated}',
                    'text-font': ['Open Sans Semibold', 'Arial Unicode MS Bold'],
                    'text-size': 12
                }
            });

            map.addLayer({
                id: 'unclustered-point',
                type: 'circle',
                source: 'loans',
                filter: ['!', ['has', 'point_count']],
                paint: {
                    'circle-color': '#11b4da',
                    'circle-radius': 5,
                    'circle-stroke-width': 1,
                    'circle-stroke-color': '#fff'
                }
            });

            map.on('click', 'clusters', (e) => {
                const features = map.queryRenderedFeatures(e.point, {
                    layers: ['clusters']
                });
                const clusterId = features[0].properties.cluster_id;
                map.getSource('loans').getClusterExpansionZoom(
                    clusterId,
                    (err, zoom) => {
                        if (err) return;
                        map.easeTo({
                            center: features[0].geometry.coordinates,
                            zoom: zoom
                        });
                    }
                );
            });

            map.on('click', 'unclustered-point', (e) => {
                const coordinates = e.features[0].geometry.coordinates.slice();
                const props = e.features[0].properties;
                const amount = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(props.amount);
                
                while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                    coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
                }
                
                new maplibregl.Popup()
                    .setLngLat(coordinates)
                    .setHTML(`<strong>${props.name}</strong><br>${amount}`)
                    .addTo(map);
            });

            ['clusters', 'unclustered-point'].forEach(layer => {
                map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
                map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; });
            });

        } catch (e) {
            statusEl.innerText = 'Error loading data: ' + e;
        }
    });
</script>
</body>
</html>

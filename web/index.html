<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach under the notch and home
         indicator; the safe-area insets in App.css keep controls clear of them. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>PPP Loan Map — 11.4 million SBA PPP loans, mapped</title>
    <meta
      name="description"
      content="Every SBA Paycheck Protection Program loan in the United States, mapped: recipient, amount, and forgiveness status, from the 2024-09-30 SBA FOIA release."
    />

    <!-- Social previews (Reddit, Discord, Slack, X/Twitter). og:image and
         og:url must be absolute — crawlers don't resolve relative URLs
         against the page they fetched. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Follow the PPP" />
    <meta property="og:title" content="Every PPP loan in America, mapped block by block" />
    <meta
      property="og:description"
      content="11.4 million SBA Paycheck Protection Program loans — recipient, amount, and forgiveness status — from the 2024 FOIA release."
    />
    <meta property="og:url" content="https://follow-the-ppp.netlify.app/" />
    <meta property="og:image" content="https://follow-the-ppp.netlify.app/og-image.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Every PPP loan in America, mapped block by block" />
    <meta
      name="twitter:description"
      content="11.4 million SBA Paycheck Protection Program loans, mapped nationwide."
    />
    <meta name="twitter:image" content="https://follow-the-ppp.netlify.app/og-image.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Inter-roman-latin.var.woff2"
      crossorigin
    />
    <!-- Tints the iOS Safari chrome to match the theme, so the address bar
         above the map is not a white bar over a dark page. -->
    <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)" />
    <!-- Runs before the first paint: React mounting a frame later would show
         a white page to a visitor whose stored choice is dark. Kept inline
         and tiny for that reason — see web/src/lib/useTheme.ts, which owns
         the same storage key from then on. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ppp-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* No storage (Safari private mode) — the CSS default is light. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
